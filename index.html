<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F59E0B" />
    <link rel="canonical" href="https://www.iarestaurant.mx/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IA·RESTAURANT" />
    <title>IA·RESTAURANT — Operating System for Restaurants</title>
    <meta name="description" content="Centro de mando gastronómico con inteligencia artificial" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var FLAG = 'iar_sw_purged_v3'
        try {
          if (sessionStorage.getItem(FLAG)) return
        } catch (e) {}
        var hadController = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller
        var tasks = []
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister()
              }))
            })
          )
        }
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key) }))
            })
          )
        }
        Promise.all(tasks).then(function () {
          try { sessionStorage.setItem(FLAG, '1') } catch (e) {}
          if (hadController) location.reload()
        }).catch(function () {
          try { sessionStorage.setItem(FLAG, '1') } catch (e) {}
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
